version: '3.8'

services:
  # Flutter Web App
  flutter-web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      - API_BASE_URL=${API_BASE_URL:-http://localhost:3001/api/v1}
    restart: unless-stopped
    networks:
      - qafila-network

  # Optional: Add your backend API here
  # backend-api:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   ports:
  #     - "3001:3001"
  #   environment:
  #     - NODE_ENV=production
  #     - DATABASE_URL=${DATABASE_URL}
  #   restart: unless-stopped
  #   networks:
  #     - qafila-network

networks:
  qafila-network:
    driver: bridge

